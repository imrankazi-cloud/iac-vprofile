

name:  "VProfile-IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**    

environment:
    # Credentials for the AWS account
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # Bucket name for Terraform state
    TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    AWS_REGION: us-east-1
    EKS_CLUSTER: vprofile-eks
jobs:
    terraform:
        name: "Apply Terraform"
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: ./terraform
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - uses: hashicorp/setup-terraform@v3
              
            
            - name: Terraform Init
              id: init
              run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

            - name: Terraform fmt
              id: fmt
              run: terraform fmt -check -recursive

            - name: Terraform Validate
              id: validate
              run: terraform validate

            - name: Terraform Plan
              id: plan
              run: terraform plan -input=false -out=tfplan -var="aws_region=${{ secrets.AWS_REGION }}" -var="eks_cluster=${{ secrets.EKS_CLUSTER }}"
